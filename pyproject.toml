[project]
name = "data-reasoning-lab"
version = "0.1.0"
description = "MetroPulse data reasoning lab with a portfolio evidence graph"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evidence_graph"]

[[tool.mypy.overrides]]
module = [
    "pyarrow",
    "pyarrow.*",
]
ignore_missing_imports = true